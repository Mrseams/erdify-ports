name: php

on:
  push:
    branches: [main]
    paths: ["php/**", "spec/**", "oracle/**", ".github/workflows/php.yml"]
  pull_request:
    paths: ["php/**", "spec/**", "oracle/**", ".github/workflows/php.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        deps: ["highest"]
        include:
          - php: "8.2"
            deps: "lowest"
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Tests (includes every upstream conformance fixture)
        run: vendor/bin/phpunit

  crosscheck:
    # Renders this package's Laravel golden files with the real Python erdify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Golden files match upstream erdify
        working-directory: oracle
        run: uv run crosscheck.py ../php/tests/fixtures
