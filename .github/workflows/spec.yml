name: spec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # Regenerates every fixture with the pinned upstream erdify and fails if
      # the committed spec/ differs. Also validates every model against
      # spec/ir.schema.json and compares against upstream's own golden files.
      - name: Check spec fixtures
        working-directory: oracle
        run: uv run build_fixtures.py --check
